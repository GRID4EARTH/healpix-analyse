[workspace]
authors = ["Jean-Marc Delouis"]
channels = ["conda-forge"]
name = "healpix-analyse"
platforms = ["linux-64"]
version = "2026.8.1"

[tasks]

[dependencies]
numpy = ">=2.4.2,<3"
python = ">=3.10,<3.14"
jupyterlab = ">=4.5.5,<5"
pytorch = ">=2.0,<3"


[pypi-dependencies]
healpix-analyse= { path = ".", editable = true }
healpix-geo = "*"

[feature.affine.dependencies]
affine = "*"

# --- DINOv3 embeddings (healpix_analyse.dino) -------------------------------
# The backbone is fetched at run time from Meta's distribution and is governed
# by the DINOv3 License; the SAT-493M weights are gated (see docs/dino.md).
# Only what the DINOv3 code needs to import is declared here.
[feature.dino.dependencies]
termcolor = "*"

[feature.dino-hf.dependencies]
transformers = ">=4.40"

# --- the Sentinel-2 example and the tuning notebook -------------------------
[feature.examples.dependencies]
xarray = ">=2024.1"
zarr = ">=2.18"
dask = "*"
fsspec = "*"
aiohttp = "*"
scikit-learn = ">=1.3"
umap-learn = ">=0.5"
matplotlib-base = ">=3.7,<4"
cartopy = ">=0.22"

[feature.examples.pypi-dependencies]
# not published on PyPI, hence the git source
healpix-plot = { git = "https://github.com/GRID4EARTH/healpix-plot" }

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[feature.docs.dependencies]
fftw = "*"
sphinx = "*"
pydata-sphinx-theme = "*"
myst-nb = "*"
sphinx-autobuild = "*"
sphinx-autoapi = "*"
sphinx-design = "*"
matplotlib-base = ">=3.7,<4"
pandas = "*"
tabulate = "*"

[feature.test.tasks]
tests = { cmd = "pytest --cov=healpix_analyse" }

[feature.docs.tasks]
build-docs = { cmd = "rm -rf generated/; set +e; python -m sphinx -b html -w warnings.log -W -Tn -j auto . _build; sphinx_status=$?; set -e; cat warnings.log; exit $sphinx_status", cwd = "docs" }
autobuild-docs = { cmd = "sphinx-autobuild -b html -w warnings.log -W -Tn -j auto . _build", cwd = "docs" }

[feature.dev.dependencies]
ipython = "*"
jupyterlab = "*"
black = "*"
jupyter-resource-usage = "*"
jupyterlab_code_formatter = "*"
isort = "*"


[environments]
default = ["test", "dev", "affine", "dino", "examples"]
docs = ["docs"]
# a lighter environment when only the embeddings are needed
dino = ["dino", "examples"]
dino-hf = ["dino", "dino-hf", "examples"]
