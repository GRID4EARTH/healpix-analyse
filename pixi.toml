[workspace]
authors = ["Jean-Marc Delouis", "Tina Odaka"]
channels = ["conda-forge"]
name = "healpix-analyse"
platforms = ["linux-64", "osx-arm64"]
version = "2026.8.1"

[tasks]

[dependencies]
numpy = ">=2.4.2,<3"
python = ">=3.10,<3.14"
jupyterlab = ">=4.5.5,<5"
pytorch = ">=2.0,<3"
pyproj = ">=3.6"
healpy = ">=1.16"


[pypi-dependencies]
healpix-analyse= { path = ".", editable = true }
# Native batched cone_coverage is required to preserve filtering performance.
# Replace this validation pin only with a release containing that API.
healpix-geo = { git = "https://github.com/tinaok/healpix-geo.git", rev = "5a43c343d2f5940ae87a730fbedb856e0256ef4a", subdirectory = "healpix-geo-python" }

[feature.affine.dependencies]
affine = "*"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[feature.docs.dependencies]
fftw = "*"
sphinx = "*"
pydata-sphinx-theme = "*"
myst-nb = "*"
sphinx-autobuild = "*"
sphinx-autoapi = "*"
sphinx-design = "*"
matplotlib-base = ">=3.7,<4"
pandas = "*"
tabulate = "*"

[feature.test.tasks]
tests = { cmd = "pytest --cov=healpix_analyse" }

[feature.docs.tasks]
build-docs = { cmd = "rm -rf generated/; set +e; python -m sphinx -b html -w warnings.log -W -Tn -j auto . _build; sphinx_status=$?; set -e; cat warnings.log; exit $sphinx_status", cwd = "docs" }
autobuild-docs = { cmd = "sphinx-autobuild -b html -w warnings.log -W -Tn -j auto . _build", cwd = "docs" }

[feature.dev.dependencies]
ipython = "*"
jupyterlab = "*"
black = "*"
jupyter-resource-usage = "*"
jupyterlab_code_formatter = "*"
isort = "*"


[environments]
default = ["test", "dev", "affine"]
docs = ["docs"]
