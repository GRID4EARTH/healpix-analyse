  directional_filter_migration: dev/directional_filter_migration
  neighbour_reduce: stats/neighbour_reduce
  gradient: stats/gradient
  divcurl: stats/divcurl
  morphology: stats/morphology
  components: stats/components
  minkowski: stats/minkowski
  healpix_sht: sht/healpix_sht
  healpix_sht_api: sht/healpix_sht
  healpix_sht_maths: sht/healpix_sht_maths
