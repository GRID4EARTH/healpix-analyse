# Tool catalogue of healpix-analyse
#
# The single source of truth for "which tool for which task". The docs build
# (docs/_ext/tool_catalogue.py) checks it against healpix_analyse.__all__ and
# generates from it the decision tables of the family landing pages, the API
# reference grouped by family, and llms.txt / llms-full.txt.
#
# Every statement here must come from the code or from the docs pages; write
# "to be measured" rather than guess a number.
#
# Fields of a tool:
#   id, title, family (A/B/C/D), page (docname, optional #anchor)
#   symbols:       names exported in healpix_analyse.__all__ (each exactly once)
#   not_exported:  qualified names of documented entry points that are not
#                  exported from healpix_analyse
#   also:          other names covered (methods, options) that an answer may use
#   use:           the names shown in the "Use" column (default: first name)
#   status:        stable | experimental | unused | legacy (checked by the build)
#   summary, tasks ("I want to ..."), keywords
#   domain, ordering, ellipsoid, io, differentiable, gpu, nan, cost
#   pros, cons, use_instead [{when, use, page}], optional_deps

intro: >-
  PyTorch tools to analyse values stored on HEALPix grids, built for Earth
  observation: convolution and filtering in metres, neighbourhood statistics,
  spherical harmonics and local FFT spectra, resolution changes, interpolation
  and foundation-model embeddings, on the whole sphere or on a regional set of
  NESTED cells.

key_pages:
  - [start/overview, "Which tool for which task? (decision guide)"]
  - [start/conventions, "Conventions: cell ids, levels, ellipsoids, units, shapes"]
  - [start/installation, "Installation and optional dependencies"]
  - [api/index, "API reference by family"]

